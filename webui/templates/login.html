<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вхід — Золотий пончик</title>
  <style>
    body{margin:0;background:#0f172a;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh}
    .card{width:min(420px,calc(100% - 32px));background:#111827;border:1px solid #334155;border-radius:16px;padding:28px;box-sizing:border-box}
    h1{margin:0 0 8px;font-size:24px} p{color:#94a3b8;margin:0 0 22px}
    label{display:block;margin:14px 0 6px} input{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:#fff}
    button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;font-weight:700;cursor:pointer}
    .error{background:#3f1d24;color:#fecaca;padding:10px 12px;border-radius:9px;margin-bottom:14px}
    small{display:block;color:#64748b;margin-top:16px}
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Золотий пончик</h1>
    <p>Вхід до панелі керування</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next_path }}">
    <label for="username">Логін</label><input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Увійти</button>
    <small>Сесія діє обмежений час і зберігається в HttpOnly cookie.</small>
  </form>
</body>
</html>
